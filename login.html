<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Home Security System</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <!-- Left Security Section -->
        <div class="security-panel">

            <div class="shield">
                🛡️
            </div>

            <h1>Home Security</h1>

            <p>
                Smart Home Security Alarm System
            </p>

            <div class="security-info">
                <div>
                    <span>●</span>
                    PIR Sensor Monitoring
                </div>

                <div>
                    <span>●</span>
                    Real-Time Protection
                </div>

                <div>
                    <span>●</span>
                    Alarm System Active
                </div>
            </div>

        </div>


        <!-- Login Section -->
        <div class="login-panel">

            <div class="login-header">

                <div class="login-icon">
                    🔐
                </div>
                

                <h2>Welcome Back</h2>

                <p>
                    Login to access your security dashboard
                </p>

            </div>


            <form id="loginForm">

                <!-- Username -->
                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">🔑</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- Remember -->
                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>Remember me</span>

                    </label>

                    <span class="secure-text">
                        🔒 Secure Login
                    </span>

                </div>


                <!-- Error Message -->
                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-button"
                >

                    <span>Login to Dashboard</span>

                    <span>→</span>

                </button>

            </form>


            <div class="login-footer">

                <p>
                    Home Security Alarm System
                </p>

                <small>
                    MCA Mini Project • Arduino + PIR Sensor
                </small>

            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>
</html>
